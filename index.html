<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi 3er Semestre</title>
<style>
:root{
  --bg-image: url('descarga.jpg');
  --dark:#0d0d1a; --blue:#273a65; --purple:#6e5a8c; --bone:#e8dfc8; --pale:#a9c3d6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Georgia,serif;background:var(--dark) var(--bg-image) fixed center/cover;color:var(--bone);min-height:100vh; padding-bottom:50px;}
body::before{content:'';position:fixed;inset:0;background:rgba(13,13,26,0.88);z-index:-1}
.header{text-align:center;padding:25px 10px;border-bottom:2px solid var(--pale)}
.header h1{font-size:2.5rem;letter-spacing:3px;color:var(--pale)}
.view{display:none;animation:fade .5s} .view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.center{max-width:900px;margin:30px auto;padding:0 20px;text-align:center}
.btn-main{display:block;width:340px;margin:16px auto;padding:16px;background:var(--bone);color:var(--blue);border-radius:30px;font-weight:bold;font-size:1.2rem;border:2px solid var(--pale);cursor:pointer}
.btn-main:hover{background:var(--blue);color:var(--bone)}
.btn-back{display:inline-block;margin:20px;padding:8px 18px;background:rgba(232,223,200,0.2);border:1px solid var(--pale);border-radius:20px;color:var(--bone);cursor:pointer}
.container{display:flex;max-width:1300px;margin:20px auto;gap:20px;padding:0 20px}
.sidebar{width:320px;min-width:320px;background:rgba(232,223,200,0.92);border-radius:15px;padding:20px;color:#1a1a2e;position:sticky;top:20px;height:fit-content}
.content{flex:1;background:rgba(232,223,200,0.94);color:#1a1a2e;border-radius:15px;padding:35px;min-height:400px}
.materia-item{padding:12px 15px;margin:10px 0;background:rgba(39,58,101,0.07);border-left:4px solid var(--purple);border-radius:0 12px 12px 0;cursor:pointer}
.materia-item:hover{background:rgba(110,90,140,0.15);transform:translateX(5px)}
.temario h2{color:var(--blue);border-bottom:2px double var(--purple);padding-bottom:8px;margin-bottom:15px}
.temario li{padding:7px 0 7px 25px;position:relative;list-style:none;border-bottom:1px dotted rgba(0,0,0,0.1)}
.temario li::before{content:'🦋';position:absolute;left:0}
@media(max-width:900px){.container{flex-direction:column}.sidebar{width:100%;position:relative}}
</style>
</head>
<body>
<div class="header">
  <h1>✧ Mi 3er Semestre ✧</h1>
  <p><i>"Yo nunca tuve un sueño hecho realidad, hasta que tú llegaste" — Emily</i></p>
  <div>🦴 ── 🦋 ── 💀 ── 🌙 ── 🦴</div>
</div>

<div id="view-parciales" class="view active">
  <div class="center">
    <div style="font-size:4rem">💀🦋👰</div>
    <h2>Selecciona un Parcial</h2>
    <button class="btn-main" onclick="openParcial('p1')">🦋 PARCIAL 1</button>
    <button class="btn-main" onclick="openParcial('p2')">💀 PARCIAL 2</button>
    <button class="btn-main" onclick="openParcial('p3')">🦴 PARCIAL 3</button>
  </div>
</div>

<div id="view-materias" class="view">
  <div class="center">
    <button class="btn-back" onclick="showView('view-parciales')">← Volver a Parciales</button>
    <h1 id="titulo-parcial">Parcial 3</h1>
    <div id="lista-materias" style="text-align:left;max-width:650px;margin:20px auto"></div>
  </div>
</div>

<div id="view-temario" class="view">
  <div class="container">
    <div class="sidebar">
      <button class="btn-back" onclick="backToMaterias()">← Volver</button>
      <h2 id="sidebar-title">Materias</h2>
      <div id="sidebar-menu"></div>
    </div>
    <div class="content"><div id="contenido-materia"></div></div>
  </div>
</div>

<!-- MARQUEE HASTA ABAJO -->

    {id:'p2-mate', nombre:'Matemáticas', icon:'🦴', html:`<div class="temario"><h2>🦴 Pensamiento Matemático III</h2><ul><li>Factorización</li><li>Inecuaciones</li><li>Modelado</li></ul></div>`},
    {id:'p2-filo', nombre:'Filosofía', icon:'💀', html:`<div class="temario"><h2>💀 Pensamiento Filosófico II</h2><ul><li>Política</li><li>Antropología</li><li>Corrientes filosóficas</li></ul></div>`},
    {id:'p2-naturales', nombre:'Ciencias Naturales', icon:'🌙', html:`<div class="temario"><h2>🌙 Ciencias Naturales III</h2><ul><li>Ecología</li><li>Método científico</li><li>Tecnología</li></ul></div>`},
    {id:'p2-ingles', nombre:'Inglés', icon:'🇬🇧', html:`<div class="temario"><h2>🇬🇧 Inglés III</h2><ul><li>Past Simple</li><li>Future plans</li><li>Comparative cultures</li></ul></div>`},
    {id:'p2-sub1', nombre:'Submódulo 1 - Emplea Frameworks', icon:'🕸️', html:`<div class="temario"><h2>🕸️ Submódulo 1 - Emplea Frameworks</h2><ul>

  ]},

    {id:'p3-mate', nombre:'Matemáticas', icon:'🦴', html:`<div class="temario"><h2>🦴 Pensamiento Matemático III - P3</h2><ul><li>Progresiones</li><li>Proyecto</li><li>Graficación</li></ul></div>`},
    {id:'p3-filo', nombre:'Filosofía', icon:'💀', html:`<div class="temario"><h2>💀 Pensamiento Filosófico II - P3</h2><ul><li>Humanidades</li><li>Ensayo</li><li>Debate</li></ul></div>`},

    </ul></div>`},

    {id:'p3-actividades', nombre:'Actividades Curriculares', icon:'🎨', html:`<div class="temario"><h2>🎨 Actividades Curriculares</h2><ul><li>Concurso</li><li>Habilidades digitales</li><li>Portafolio</li></ul></div>`},
    {id:'p3-orientacion', nombre:'Orientación', icon:'🧭', html:`<div class="temario"><h2>🧭 Orientación</h2><ul><li>Finanzas</li><li>Currículum vitae (CV)</li><li>Feria vocacional</li></ul></div>`}

let parcialActual = 'p3';
function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});}
function openParcial(p){
  parcialActual=p;
  document.getElementById('titulo-parcial').innerText=datos[p].titulo;
  const lista=document.getElementById('lista-materias');lista.innerHTML='';
  datos[p].materias.forEach(m=>{
    const div=document.createElement('div');div.className='materia-item';div.innerHTML=`${m.icon} ${m.nombre}`;div.onclick=()=>openMateria(m.id);lista.appendChild(div);
  });
  showView('view-materias');
}
function openMateria(idMateria){
  const materia=datos[parcialActual].materias.find(m=>m.id===idMateria);
  document.getElementById('contenido-materia').innerHTML=materia.html;
  const menu=document.getElementById('sidebar-menu');menu.innerHTML='';document.getElementById('sidebar-title').innerText=datos[parcialActual].titulo;
  datos[parcialActual].materias.forEach(m=>{
    const it=document.createElement('div');it.className='materia-item';if(m.id===idMateria){it.style.background='linear-gradient(90deg,#273a65,#6e5a8c)';it.style.color='#e8dfc8';}
    it.innerHTML=`${m.icon} ${m.nombre}`;it.onclick=()=>openMateria(m.id);menu.appendChild(it);
  });
  showView('view-temario');
}
function backToMaterias(){openParcial(parcialActual);}
</script>

</html>
